# Intégration continue de ResaVroom (D42) : tests, lint, build puis types, sur chaque push de dev-claude et main.
# Aucun secret : le build reçoit une DATABASE_URL factice et ne peut lire aucune base (D30). Le build écrit
# .next/types, que tsc lit ensuite (piège 14).

name: CI

on:
  push:
    branches: [dev-claude, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: "postgresql://build:build@build.invalid:5432/build"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: npx tsc --noEmit
